<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Gallery Idle</title>
    <style>
      :root {
        --bg: #121826;
        --panel: #1b2334;
        --panel-alt: #232d42;
        --accent: #76e4c6;
        --accent-2: #ffbf69;
        --text: #e9f2ff;
        --muted: #9db0c7;
        --gold: #ffd166;
        --danger: #fd6b6b;
        --shadow: rgba(0, 0, 0, 0.25);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0d1321, var(--bg));
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .game {
        width: min(920px, 100%);
        background: rgba(27, 35, 52, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
        padding: 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--panel-alt);
        border-radius: 12px;
        padding: 14px 16px;
        border: 1px solid rgba(255,255,255,0.05);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .stat-value {
        margin-top: 8px;
        font-weight: 700;
        font-size: clamp(1.15rem, 2vw, 1.7rem);
      }

      .panel {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 24px;
      }

      .card {
        background: var(--panel-alt);
        border-radius: 16px;
        padding: 18px;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .collect-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 18px 20px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        color: #0d1321;
        background: linear-gradient(135deg, var(--accent), #9af0d1);
        box-shadow: 0 10px 22px rgba(118, 228, 198, 0.26);
        transition: transform 0.12s ease, filter 0.2s ease;
      }

      .collect-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
      .collect-btn:active { transform: translateY(0); }

      .shop {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .upgrade {
        width: 100%;
        text-align: left;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .upgrade:hover {
        border-color: rgba(118, 228, 198, 0.7);
        background: rgba(118, 228, 198, 0.06);
      }

      .upgrade .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.95rem;
      }

      .upgrade .name { font-weight: 700; }
      .upgrade .cost { color: var(--gold); }
      .upgrade .bonus { color: var(--accent); }

      .achievements {
        margin-top: 18px;
      }

      .achievement-list {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
        display: grid;
        gap: 10px;
      }

      .achievement {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        opacity: 0.6;
      }

      .achievement.unlocked {
        opacity: 1;
        background: rgba(118, 228, 198, 0.08);
        border-color: rgba(118, 228, 198, 0.5);
      }

      .badge {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        background: rgba(255,255,255,0.06);
      }

      .achievement.unlocked .badge {
        background: linear-gradient(135deg, var(--gold), #ffe29a);
        color: #2f2400;
      }

      .achievement h4 {
        margin: 0 0 4px;
        font-size: 0.98rem;
      }

      .achievement p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (max-width: 760px) {
        .panel {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="topbar">
        <h1>Little Gallery Idle</h1>
        <div class="reset-wrap">
          <button id="resetBtn" class="collect-btn" style="padding: 10px 16px; width: auto; background: linear-gradient(135deg, #ffbf69, #ffd7a3);">Reset</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Coins</div>
          <div class="stat-value" id="coins">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Per Second</div>
          <div class="stat-value" id="income">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="total">0</div>
        </div>
      </div>

      <div class="panel">
        <div class="card">
          <button id="collectBtn" class="collect-btn">Sell a Painting</button>
          <div class="shop" id="shop"></div>
        </div>

        <div class="card achievements">
          <h3>Achievements</h3>
          <ul id="achievementList" class="achievement-list"></ul>
        </div>
      </div>
    </div>

    <script>
      const defaultState = {
        coins: 0,
        totalEarned: 0,
        income: 0,
        clickPower: 1,
        upgrades: {
          brush: 0,
          studio: 0,
          assistant: 0,
          gallery: 0
        }
      };

      const upgrades = [
        { key: 'brush', name: 'Brush', baseCost: 15, bonus: 0.5, description: '+0.5 coins/sec' },
        { key: 'studio', name: 'Studio', baseCost: 60, bonus: 2, description: '+2 coins/sec' },
        { key: 'assistant', name: 'Assistant', baseCost: 220, bonus: 8, description: '+8 coins/sec' },
        { key: 'gallery', name: 'Gallery', baseCost: 900, bonus: 30, description: '+30 coins/sec' }
      ];

      const achievements = [
        { key: 'firstClick', name: 'First Sale', description: 'Earn your first coin.', check: (state) => state.totalEarned >= 1 },
        { key: 'starter', name: 'Starter Artist', description: 'Reach 25 total coins.', check: (state) => state.totalEarned >= 25 },
        { key: 'busy', name: 'Getting Busy', description: 'Reach 100 total coins.', check: (state) => state.totalEarned >= 100 },
        { key: 'collector', name: 'Collector', description: 'Reach 500 total coins.', check: (state) => state.totalEarned >= 500 },
        { key: 'pro', name: 'Professional', description: 'Reach 2000 total coins.', check: (state) => state.totalEarned >= 2000 },
        { key: 'idle', name: 'Idle Legend', description: 'Reach 10 coins/sec income.', check: (state) => state.income >= 10 },
        { key: 'upgrade', name: 'Rising Brand', description: 'Buy your first upgrade.', check: (state) => Object.values(state.upgrades).some((count) => count > 0) }
      ];

      let game = loadGame();

      const coinsEl = document.getElementById('coins');
      const incomeEl = document.getElementById('income');
      const totalEl = document.getElementById('total');
      const shopEl = document.getElementById('shop');
      const achievementListEl = document.getElementById('achievementList');
      const collectBtn = document.getElementById('collectBtn');
      const resetBtn = document.getElementById('resetBtn');

      function loadGame() {
        const saved = localStorage.getItem('little-gallery-idle');
        if (!saved) return JSON.parse(JSON.stringify(defaultState));

        try {
          const parsed = JSON.parse(saved);
          return { ...JSON.parse(JSON.stringify(defaultState)), ...parsed, upgrades: { ...defaultState.upgrades, ...(parsed.upgrades || {}) } };
        } catch {
          return JSON.parse(JSON.stringify(defaultState));
        }
      }

      function saveGame() {
        localStorage.setItem('little-gallery-idle', JSON.stringify(game));
      }

      function getUpgradeCost(upgrade) {
        return Math.floor(upgrade.baseCost * Math.pow(1.35, game.upgrades[upgrade.key]));
      }

      function updateIncome() {
        game.income = 0;
        for (const upgrade of upgrades) {
          game.income += (game.upgrades[upgrade.key] * upgrade.bonus);
        }
      }

      function updateAchievements() {
        const unlocked = new Set();

        for (const achievement of achievements) {
          if (achievement.check(game)) {
            unlocked.add(achievement.key);
          }
        }

        achievementListEl.innerHTML = achievements
          .map((achievement) => {
            const unlockedState = unlocked.has(achievement.key) ? 'unlocked' : '';
            const icon = unlocked.has(achievement.key) ? '✓' : '★';
            return `
              <li class="achievement ${unlockedState}">
                <div class="badge">${icon}</div>
                <div>
                  <h4>${achievement.name}</h4>
                  <p>${achievement.description}</p>
                </div>
              </li>
            `;
          })
          .join('');
      }

      function renderShop() {
        shopEl.innerHTML = upgrades
          .map((upgrade) => {
            const ownCount = game.upgrades[upgrade.key];
            const cost = getUpgradeCost(upgrade);
            return `
              <button class="upgrade" data-key="${upgrade.key}" ${game.coins >= cost ? '' : 'disabled'}>
                <div class="meta">
                  <span class="name">${upgrade.name} x${ownCount}</span>
                  <span class="cost">${cost} coin${cost === 1 ? '' : 's'}</span>
                </div>
                <div class="meta">
                  <span class="bonus">${upgrade.description}</span>
                </div>
              </button>
            `;
          })
          .join('');

        shopEl.querySelectorAll('.upgrade').forEach((button) => {
          button.addEventListener('click', () => {
            const key = button.dataset.key;
            const upgrade = upgrades.find((item) => item.key === key);
            if (!upgrade) return;

            const cost = getUpgradeCost(upgrade);
            if (game.coins < cost) return;

            game.coins -= cost;
            game.upgrades[key] += 1;
            updateIncome();
            render();
            saveGame();
          });
        });
      }

      function render() {
        coinsEl.textContent = Math.floor(game.coins).toLocaleString();
        incomeEl.textContent = Number(game.income).toFixed(1);
        totalEl.textContent = Math.floor(game.totalEarned).toLocaleString();
        updateAchievements();
        renderShop();
      }

      function earnCoins(amount) {
        game.coins += amount;
        game.totalEarned += amount;
      }

      collectBtn.addEventListener('click', () => {
        earnCoins(game.clickPower);
        render();
        saveGame();
      });

      resetBtn.addEventListener('click', () => {
        const sure = window.confirm('Reset your idle game and achievements?');
        if (!sure) return;

        game = JSON.parse(JSON.stringify(defaultState));
        updateIncome();
        render();
        saveGame();
      });

      let lastTime = performance.now();
      function tick(now) {
        const delta = (now - lastTime) / 1000;
        lastTime = now;

        if (game.income > 0) {
          earnCoins(game.income * delta);
        }

        render();
        saveGame();
        requestAnimationFrame(tick);
      }

      updateIncome();
      render();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
