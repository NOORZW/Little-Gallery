<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Triple T — Tic-Tac-Toe Simulator</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #f7f3e8;
			--muted: #a7a397;
			--bg: #111310;
			--panel: #1b1e19;
			--line: #34392f;
			--lime: #d1f36a;
			--coral: #ff806d;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 28px 18px;
			background: radial-gradient(ellipse at 50% 0%, #272b20 0, var(--bg) 58%);
			color: var(--ink);
			font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		.app { width: min(100%, 480px); }
		header { text-align: center; margin-bottom: 26px; }
		.eyebrow { color: var(--lime); font-size: .72rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
		h1 { margin: 7px 0 3px; font-size: clamp(2.4rem, 11vw, 4rem); line-height: .98; letter-spacing: -.075em; }
		h1 span { color: var(--lime); }
		.subtitle { margin: 10px 0 0; color: var(--muted); font-size: .94rem; }
		.panel { padding: clamp(18px, 5vw, 28px); border: 1px solid var(--line); border-radius: 22px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 22px 65px #0005; }
		.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
		.mode-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .68rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
		select, button { font: inherit; }
		select { appearance: none; padding: 9px 34px 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #242820; color: var(--ink); cursor: pointer; }
		.select-wrap { position: relative; }
		.select-wrap::after { content: "⌄"; position: absolute; right: 12px; top: 5px; color: var(--muted); pointer-events: none; }
		.round { color: var(--muted); font-size: .8rem; text-align: right; }
		.status { min-height: 32px; margin: 0 0 16px; text-align: center; font-size: 1.08rem; font-weight: 750; }
		.status .x { color: var(--lime); }
		.status .o { color: var(--coral); }
		.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; aspect-ratio: 1; }
		.cell { display: grid; place-items: center; border: 1px solid #3a4034; border-radius: 16px; background: #23271f; color: var(--ink); font-size: clamp(3.2rem, 17vw, 5.2rem); font-weight: 850; line-height: 1; cursor: pointer; transition: background .16s, transform .16s, border-color .16s; }
		.cell:hover:not(:disabled) { transform: translateY(-2px); border-color: #69734f; background: #2b3025; }
		.cell:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
		.cell:disabled { cursor: default; }
		.cell.x { color: var(--lime); }
		.cell.o { color: var(--coral); }
		.cell.winner { background: #343e24; border-color: var(--lime); }
		.actions { display: flex; gap: 10px; margin-top: 20px; }
		.action { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: #282d24; color: var(--ink); font-weight: 750; cursor: pointer; transition: background .16s, transform .16s; }
		.action:hover { background: #343b2b; transform: translateY(-1px); }
		.action.primary { border-color: var(--lime); background: var(--lime); color: #171a12; }
		.action.primary:hover { background: #e0ff88; }
		.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
		.score { padding: 10px 6px; border-radius: 10px; background: #22261f; text-align: center; }
		.score strong { display: block; font-size: 1.2rem; }
		.score span { color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
		footer { margin-top: 16px; color: #85877d; text-align: center; font-size: .76rem; }
		@media (max-width: 380px) { .toolbar { align-items: end; } .panel { padding: 16px; } .board { gap: 7px; } .cell { border-radius: 12px; } }
	</style>
</head>
<body>
	<main class="app">
		<header>
			<div class="eyebrow">A tiny strategy simulator</div>
			<h1>Triple <span>T</span></h1>
			<p class="subtitle">Three in a row. One very satisfying little showdown.</p>
		</header>

		<section class="panel" aria-label="Tic-tac-toe game">
			<div class="toolbar">
				<div>
					<label class="mode-label" for="mode">Game mode</label>
					<div class="select-wrap">
						<select id="mode" aria-label="Choose game mode">
							<option value="cpu">Solo vs computer</option>
							<option value="two">Two players</option>
						</select>
					</div>
				</div>
				<div class="round" id="round">Round 1</div>
			</div>

			<p class="status" id="status" aria-live="polite">Your turn — <span class="x">X</span></p>
			<div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>

			<div class="actions">
				<button class="action primary" id="new-round">New round</button>
				<button class="action" id="reset">Reset scores</button>
			</div>
			<div class="scores" aria-label="Scoreboard">
				<div class="score"><strong id="score-x">0</strong><span id="label-x">You · X</span></div>
				<div class="score"><strong id="score-draw">0</strong><span>Draws</span></div>
				<div class="score"><strong id="score-o">0</strong><span id="label-o">CPU · O</span></div>
			</div>
		</section>
		<footer>Take turns, block the line, and claim the grid.</footer>
	</main>

	<script>
		(() => {
			const boardEl = document.getElementById('board');
			const statusEl = document.getElementById('status');
			const modeEl = document.getElementById('mode');
			const roundEl = document.getElementById('round');
			const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
			let cells = Array(9).fill('');
			let turn = 'X';
			let finished = false;
			let round = 1;
			let scores = { X: 0, O: 0, draw: 0 };

			function currentWinner() {
				return wins.find(line => line.every(index => cells[index] && cells[index] === cells[line[0]]));
			}

			function render() {
				boardEl.replaceChildren();
				const winnerLine = currentWinner();
				cells.forEach((mark, index) => {
					const button = document.createElement('button');
					button.className = `cell${mark ? ` ${mark.toLowerCase()}` : ''}${winnerLine?.includes(index) ? ' winner' : ''}`;
					button.type = 'button';
					button.setAttribute('role', 'gridcell');
					button.setAttribute('aria-label', `Cell ${index + 1}${mark ? `, ${mark}` : ', empty'}`);
					button.textContent = mark;
					button.disabled = Boolean(mark) || finished || (modeEl.value === 'cpu' && turn === 'O');
					button.addEventListener('click', () => play(index));
					boardEl.append(button);
				});
				document.getElementById('score-x').textContent = scores.X;
				document.getElementById('score-o').textContent = scores.O;
				document.getElementById('score-draw').textContent = scores.draw;
				document.getElementById('label-x').textContent = modeEl.value === 'cpu' ? 'You · X' : 'Player 1 · X';
				document.getElementById('label-o').textContent = modeEl.value === 'cpu' ? 'CPU · O' : 'Player 2 · O';
				roundEl.textContent = `Round ${round}`;
			}

			function announce() {
				const line = currentWinner();
				if (line) {
					finished = true;
					scores[cells[line[0]]]++;
					const winner = cells[line[0]];
					statusEl.innerHTML = modeEl.value === 'cpu'
						? (winner === 'X' ? 'You win this round! 🎉' : 'The computer takes this one.')
						: `<span class="${winner.toLowerCase()}">Player ${winner === 'X' ? '1' : '2'} wins!</span>`;
				} else if (cells.every(Boolean)) {
					finished = true;
					scores.draw++;
					statusEl.textContent = 'A draw — nicely played.';
				} else {
					turn = turn === 'X' ? 'O' : 'X';
					statusEl.innerHTML = modeEl.value === 'cpu'
						? (turn === 'X' ? 'Your turn — <span class="x">X</span>' : 'Computer is thinking…')
						: `<span class="${turn.toLowerCase()}">Player ${turn === 'X' ? '1' : '2'} — ${turn}</span>`;
				}
				render();
			}

			function play(index) {
				if (finished || cells[index] || (modeEl.value === 'cpu' && turn === 'O')) return;
				cells[index] = turn;
				announce();
				if (!finished && modeEl.value === 'cpu' && turn === 'O') {
					window.setTimeout(computerMove, 420);
				}
			}

			function computerMove() {
				if (finished || modeEl.value !== 'cpu' || turn !== 'O') return;
				const available = cells.map((value, index) => value ? -1 : index).filter(index => index >= 0);
				// Take a win, block a win, then prefer the center and corners.
				let choice = findTacticalMove('O') ?? findTacticalMove('X');
				if (choice == null && available.includes(4)) choice = 4;
				if (choice == null) {
					const corners = [0, 2, 6, 8].filter(index => available.includes(index));
					if (corners.length) choice = corners[Math.floor(Math.random() * corners.length)];
				}
				if (choice == null) choice = available[Math.floor(Math.random() * available.length)];
				if (choice == null) return;
				cells[choice] = 'O';
				announce();
			}

			function findTacticalMove(mark) {
				for (const index of cells.map((value, i) => value ? -1 : i).filter(i => i >= 0)) {
					cells[index] = mark;
					const winsNow = Boolean(currentWinner());
					cells[index] = '';
					if (winsNow) return index;
				}
				return null;
			}

			function newRound() {
				cells = Array(9).fill('');
				turn = 'X';
				finished = false;
				round++;
				statusEl.innerHTML = modeEl.value === 'cpu' ? 'Your turn — <span class="x">X</span>' : '<span class="x">Player 1 — X</span>';
				render();
			}

			document.getElementById('new-round').addEventListener('click', newRound);
			document.getElementById('reset').addEventListener('click', () => {
				scores = { X: 0, O: 0, draw: 0 };
				round = 0;
				newRound();
			});
			modeEl.addEventListener('change', () => {
				scores = { X: 0, O: 0, draw: 0 };
				round = 0;
				newRound();
			});
			render();
		})();
	</script>
</body>
</html>
