<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Gallery — Idle Art Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--ink:#25231f;--muted:#878176;--paper:#f5f0e7;--gold:#e5b95e;--coral:#e98169;--mint:#9ec5a3}*{box-sizing:border-box}body{margin:0;background:#eee8dd;color:var(--ink);font-family:'DM Sans',sans-serif;overflow:hidden}.app{height:100vh;min-height:640px;display:grid;grid-template-columns:310px 1fr}.sidebar{background:#fbf8f2;padding:27px 24px;display:flex;flex-direction:column;z-index:2;box-shadow:8px 0 30px #29231a12;overflow-y:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.brand-icon{width:42px;height:42px;border-radius:14px;background:#282722;color:#f6cb75;display:grid;place-items:center;font-size:23px}.brand h1{font:700 20px 'Playfair Display',serif;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.07em;text-transform:uppercase}.wallet{padding:17px 18px;background:#f1ece2;border-radius:16px;margin-bottom:24px}.wallet-label,.section-label{font:500 10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.cash{font:700 29px 'Playfair Display',serif;margin:5px 0 2px}.rate{font-size:12px;color:#658768}.section-head{display:flex;justify-content:space-between;align-items:center;margin:3px 0 11px}.section-head b{font-size:13px}.level-pill{font:11px 'DM Mono',monospace;background:#ede5d7;padding:5px 8px;border-radius:20px}.upgrade{position:relative;width:100%;border:1px solid #e8e1d6;background:#fffdfa;border-radius:13px;padding:13px;text-align:left;display:flex;gap:11px;align-items:center;margin-bottom:9px;color:var(--ink);cursor:pointer;transition:.18s}.upgrade:hover:not(:disabled){transform:translateY(-2px);border-color:#d6bd8b;box-shadow:0 6px 16px #33231110}.upgrade:disabled{opacity:.48;cursor:not-allowed}.up-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:#f6e8ca;flex:none}.upgrade:nth-of-type(2) .up-icon{background:#e8eee1}.upgrade:nth-of-type(3) .up-icon{background:#f5e1dc}.upgrade-copy{flex:1;min-width:0}.upgrade-copy strong{display:block;font-size:12px}.upgrade-copy small{color:var(--muted);font-size:10px;display:block;margin-top:3px}.up-cost{font:11px 'DM Mono',monospace;white-space:nowrap;color:#977333}.spacer{flex:1;min-height:20px}.daily{background:#292822;color:#f9f4e9;border-radius:15px;padding:15px 16px;margin-top:17px}.daily-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.daily-top span{color:#f1c96e}.daily p{font-size:11px;color:#c5c0b3;margin:7px 0 10px}.progress{height:5px;border-radius:8px;background:#ffffff25;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#e8bf68;border-radius:8px;transition:width .3s}.daily small{display:block;text-align:right;font:10px 'DM Mono',monospace;color:#d7cba8;margin-top:7px}.reset{margin-top:14px;border:0;background:none;color:#aaa397;font-size:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}.main{position:relative;overflow:hidden;background:#d8d1c4}.scene{position:absolute;inset:0}.scene canvas{display:block;width:100%;height:100%}.topbar{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.location{background:#fbf8f0e8;backdrop-filter:blur(8px);padding:11px 15px;border-radius:12px;box-shadow:0 5px 20px #30271a12}.location b{font:600 13px 'Playfair Display',serif}.location small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.sound{pointer-events:auto;border:0;background:#fbf8f0e8;border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer}.hint{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);background:#292822df;color:#fff8e9;border-radius:30px;padding:10px 16px;font-size:11px;white-space:nowrap;box-shadow:0 5px 18px #241a1830}.hint b{color:#f2c86e}.toast{position:absolute;top:88px;left:50%;transform:translate(-50%,-10px);background:#292822;color:white;padding:10px 15px;border-radius:10px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.pop{position:absolute;pointer-events:none;color:#fff3c1;font:700 16px 'DM Mono',monospace;text-shadow:0 2px 6px #30231c;animation:float .9s ease-out forwards}@keyframes float{to{transform:translateY(-45px);opacity:0}}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#d8d1c4;font:14px 'DM Sans',sans-serif;color:#665d50;z-index:5;transition:opacity .5s}.loading.done{opacity:0;pointer-events:none}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100dvh;min-height:0}.sidebar{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px;overflow:visible}.brand{grid-column:1;margin:0}.brand-icon{width:36px;height:36px}.brand h1{font-size:17px}.wallet{grid-column:2;grid-row:1;margin:0;padding:9px 12px}.cash{font-size:22px;margin:0}.wallet-label{font-size:8px}.rate{font-size:10px}.section-head{grid-column:1/-1;margin:2px 0 0}.upgrade{margin:0;padding:9px;gap:7px}.up-icon{width:30px;height:30px;font-size:15px}.upgrade-copy strong{font-size:10px}.upgrade-copy small{font-size:9px}.up-cost{font-size:9px}.daily,.spacer,.reset{display:none}.main{min-height:0}.topbar{top:12px;left:12px;right:12px}.hint{bottom:15px;font-size:10px}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="brand-icon">✳</div><div><h1>Little Gallery</h1><small>Your tiny art empire</small></div></div>
  <div class="wallet"><div class="wallet-label">Gallery funds</div><div class="cash" id="cash">$0</div><div class="rate">↗ <span id="rate">$0</span> / second</div></div>
  <div class="section-head"><b>Studio upgrades</b><span class="level-pill" id="level">LVL 1</span></div>
  <button class="upgrade" id="brush"><span class="up-icon">🖌️</span><span class="upgrade-copy"><strong>Better brushes</strong><small>More value per stroke · Lv <i>0</i></small></span><span class="up-cost">$<span>15</span></span></button>
  <button class="upgrade" id="assistant"><span class="up-icon">🧑‍🎨</span><span class="upgrade-copy"><strong>Hire an artist</strong><small>Paintings earn while you rest · Lv <i>0</i></small></span><span class="up-cost">$<span>50</span></span></button>
  <button class="upgrade" id="room"><span class="up-icon">🖼️</span><span class="upgrade-copy"><strong>Expand the gallery</strong><small>More visitors, more tips · Lv <i>0</i></small></span><span class="up-cost">$<span>120</span></span></button>
  <div class="spacer"></div>
  <div class="daily"><div class="daily-top">Today's little goal <span>✦</span></div><p>Make 30 brushstrokes and earn a sweet bonus.</p><div class="progress"><i id="progress"></i></div><small><span id="strokes">0</span> / 30 strokes</small></div>
  <button class="reset" id="reset">Start a fresh canvas</button>
 </aside>
 <main class="main"><div class="scene" id="scene"></div>
  <div class="topbar"><div class="location"><b>The Sunroom</b><small>Open daily · Est. just now</small></div><button class="sound" id="sound" aria-label="Toggle sound">♫</button></div>
  <div class="hint">Click the canvas to paint <b>·</b> Each stroke earns <b id="tapval">$1</b></div><div class="toast" id="toast"></div><div class="loading" id="loading">Setting up your little gallery…</div>
 </main>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s), sceneEl=$('#scene');
let money=0,strokes=0,brush=0,assist=0,room=0,painted=0,soundOn=true;
const saved=JSON.parse(localStorage.getItem('littleGallery')||'{}');
money=saved.money||0;strokes=saved.strokes||0;brush=saved.brush||0;assist=saved.assist||0;room=saved.room||0;painted=saved.painted||0;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;sceneEl.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#d8d1c4');scene.fog=new THREE.Fog('#d8d1c4',13,27);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,2.4,10.6);camera.lookAt(0,1.9,0);
scene.add(new THREE.HemisphereLight('#fff5df','#777064',2));const sun=new THREE.DirectionalLight('#fff1d2',3.2);sun.position.set(-4,8,6);sun.castShadow=true;scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
function box(w,h,d,m,x,y,z,sh=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;scene.add(o);return o}
// Warm little room
box(18,.2,16,mat('#9a8065'),0,-.12,0);box(18,9,.2,mat('#e9dfcf'),0,4.4,-3.6);box(.2,9,16,mat('#e5dac9'),-8.9,4.4,4.4);box(.2,9,16,mat('#e5dac9'),8.9,4.4,4.4);box(18,.2,16,mat('#d7c8b3'),0,8.9,0);
// floorboards
for(let z=-7;z<8;z+=1.3)box(17.8,.025,.018,mat('#806b56'),0,.005,z,false);
// wall trim
box(18,.18,.12,mat('#c5ad8f'),0,.35,-3.43);box(18,.18,.12,mat('#c5ad8f'),0,8.1,-3.43);
// windows
for(let x of [-5.7,5.7]){box(2.35,3.8,.12,mat('#b88965'),x,4.8,-3.43);box(2.05,3.48,.08,mat('#a8c7c2',.3),x,4.82,-3.34);box(.09,3.5,.04,mat('#f3e5cb'),x,4.82,-3.26);box(2.1,.09,.04,mat('#f3e5cb'),x,4.82,-3.25);box(2.55,.13,.35,mat('#c0946c'),x,2.82,-3.22)}
// canvases with generated painterly texture
const artColors=[['#ed9a76','#efc66c','#467b78','#544b65'],['#8db6a0','#e3c18c','#d9846d','#353d3c'],['#8795ba','#edb988','#c46b61','#e8d8ae'],['#d98970','#f0c75d','#608e83','#5d4b68'],['#88aeb1','#e6d2a4','#c77c61','#4c566a']];
let canvases=[];
function textureArt(seed){let c=document.createElement('canvas');c.width=240;c.height=300;let g=c.getContext('2d'),colors=artColors[seed%artColors.length];g.fillStyle=colors[0];g.fillRect(0,0,240,300);for(let i=0;i<20;i++){g.globalAlpha=.16;g.fillStyle=colors[i%4];g.beginPath();g.ellipse(Math.random()*240,Math.random()*300,20+Math.random()*80,15+Math.random()*55,Math.random()*3,0,7);g.fill()}g.globalAlpha=1;
// abstract sun and hills
g.fillStyle=colors[1];g.beginPath();g.arc(166,82,35+seed%3*5,0,7);g.fill();g.fillStyle=colors[2];g.beginPath();g.moveTo(0,205);g.quadraticCurveTo(55,125,115,208);g.quadraticCurveTo(180,120,240,190);g.lineTo(240,300);g.lineTo(0,300);g.fill();g.fillStyle=colors[3];g.beginPath();g.moveTo(0,246);g.quadraticCurveTo(95,180,156,246);g.quadraticCurveTo(200,206,240,230);g.lineTo(240,300);g.lineTo(0,300);g.fill();for(let i=0;i<16;i++){g.strokeStyle=colors[i%4];g.globalAlpha=.4;g.lineWidth=2;g.beginPath();let x=Math.random()*240,y=Math.random()*300;g.moveTo(x,y);g.lineTo(x+Math.random()*20-10,y+Math.random()*13);g.stroke()}g.globalAlpha=1;let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const frames=[];
function addFrame(x,y,idx){let frame=box(1.65,2.12,.16,mat(['#b7834e','#443a30','#c7a86f'][idx%3]),x,y,-3.32);let canvas=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.84),new THREE.MeshBasicMaterial({map:textureArt(idx)}));canvas.position.set(x,y,-3.22);canvas.userData.isCanvas=true;canvas.userData.id=idx;scene.add(canvas);frames.push(canvas);let top=box(1.67,.055,.18,mat('#d7bd91'),x,y+1.08,-3.21,false);let bottom=box(1.67,.055,.18,mat('#d7bd91'),x,y-1.08,-3.21,false);frames.push(frame,top,bottom)}
addFrame(-2.2,5.55,0);addFrame(0,5.55,1);addFrame(2.2,5.55,2);addFrame(-2.2,2.9,3);addFrame(2.2,2.9,4);
// gallery bench, easel, plant
box(2.7,.18,.7,mat('#6a5140'),0,.75,-.4);for(let x of [-1,1])box(.13,.75,.55,mat('#574434'),x,.36,-.4);box(1.15,.12,.8,mat('#a5764f'),-4,.08,1.1);for(let i=0;i<6;i++){let h=.35+Math.random()*.55;let leaf=new THREE.Mesh(new THREE.ConeGeometry(.12,h,5),mat(['#66846a','#7f9870','#526e5a'][i%3]));leaf.position.set(-4+(Math.random()-.5)*.55,.25+h/2,1.1+(Math.random()-.5)*.45);leaf.rotation.z=(Math.random()-.5)*.5;scene.add(leaf)}
// floating easel and blank interactive canvas
box(1.15,.11,.5,mat('#8c6847'),0,.08,2.2);for(let x of [-.42,.42]){let leg=box(.07,2,.07,mat('#916e4b'),x,1,2.35);leg.rotation.z=x*.12}let easel=box(1.15,1.52,.1,mat('#b78452'),0,2.35,2.04);let blank=new THREE.Mesh(new THREE.PlaneGeometry(1,1.37),new THREE.MeshBasicMaterial({color:'#fffaf0'}));blank.position.set(0,2.35,1.97);blank.userData.isCanvas=true;blank.userData.id=5;scene.add(blank);frames.push(blank);
// brush prop
let brushMesh=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,8),mat('#b88956'));brushMesh.position.set(.9,.35,2.5);brushMesh.rotation.z=-.55;scene.add(brushMesh);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let hover=null;
function resize(){let w=sceneEl.clientWidth,h=sceneEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function paint(e){let r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);let hit=raycaster.intersectObjects(frames.filter(o=>o.userData.isCanvas),false)[0];if(hit){strokes++;money+=1+brush*2;painted++;if(hit.object===blank){let colors=['#e87f67','#eabb55','#698f82','#8197c5','#c77d9e'];blank.material.color.set(colors[Math.floor(Math.random()*colors.length)]);blank.material.needsUpdate=true;blank.scale.setScalar(1+Math.random()*.018)}if(strokes===30){money+=25;toast('Daily goal complete! +$25 ✨')}const p=hit.point.clone().project(camera),rect=renderer.domElement.getBoundingClientRect(),el=document.createElement('div');el.className='pop';el.textContent='+$'+(1+brush*2);el.style.left=(rect.left+((p.x+1)/2)*rect.width-20)+'px';el.style.top=(rect.top+((1-p.y)/2)*rect.height-18)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900);refresh();if(soundOn)beep();}}
renderer.domElement.addEventListener('pointerdown',paint);renderer.domElement.addEventListener('pointermove',e=>{let r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);raycaster.setFromCamera(pointer,camera);let h=raycaster.intersectObjects(frames.filter(o=>o.userData.isCanvas),false)[0];renderer.domElement.style.cursor=h?'crosshair':'default'});
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function beep(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=620;o.type='sine';g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.start();o.stop(c.currentTime+.1)}catch{}}
const data={brush:{key:'brush',base:15,level:()=>brush,inc:()=>brush++,rate:()=>{}},assistant:{key:'assistant',base:50,level:()=>assist,inc:()=>assist++,rate:()=>{}},room:{key:'room',base:120,level:()=>room,inc:()=>room++,rate:()=>{}}};
function cost(k){return Math.floor(data[k].base*Math.pow(1.58,data[k].level()))}function income(){return assist*(1+room)*1.5+room*1.1}
function refresh(){ $('#cash').textContent='$'+Math.floor(money).toLocaleString();$('#rate').textContent='$'+income().toFixed(1);$('#level').textContent='LVL '+(1+Math.floor(strokes/25));$('#tapval').textContent='$'+(1+brush*2);$('#strokes').textContent=Math.min(strokes,30);$('#progress').style.width=Math.min(strokes/30*100,100)+'%';for(let k in data){let b=$('#'+k),c=cost(k);b.querySelector('.up-cost span').textContent=c.toLocaleString();b.querySelector('.upgrade-copy i').textContent=data[k].level();b.disabled=money<c}}
for(let k in data)$('#'+k).addEventListener('click',()=>{let c=cost(k);if(money>=c){money-=c;data[k].inc();toast(({brush:'Fresh brushes! Your strokes are worth more.',assistant:'A new artist joined the studio!',room:'The gallery is growing!'}[k]));refresh()}});
$('#reset').addEventListener('click',()=>{if(confirm('Start a fresh canvas? Your gallery and upgrades will reset.')){money=0;strokes=0;brush=0;assist=0;room=0;painted=0;refresh();toast('A fresh start ✨')}});$('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'♪';toast(soundOn?'Sound on':'Sound off')});
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.1);last=now;money+=income()*dt;scene.rotation.y=Math.sin(now*.0003)*.008;renderer.render(scene,camera)}requestAnimationFrame(animate);
setInterval(()=>{refresh();localStorage.setItem('littleGallery',JSON.stringify({money,strokes,brush,assist,room,painted}))},1000);refresh();setTimeout(()=>$('#loading').classList.add('done'),500);
</script>
</body>
</html>
